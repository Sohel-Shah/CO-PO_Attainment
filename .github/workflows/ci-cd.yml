name: OBC Software CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: co_po_attainment
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Run Prisma Database Migrations
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5433/co_po_attainment?schema=public"
          JWT_SECRET: "ci_cd_test_secret_key_1234567890"
        run: |
          cd backend
          npx prisma migrate deploy

      - name: Run Backend Security Unit Tests
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5433/co_po_attainment?schema=public"
          JWT_SECRET: "ci_cd_test_secret_key_1234567890"
        run: |
          cd backend
          npm test

      - name: Build Frontend Production Bundle
        run: |
          cd frontend
          npm ci
          npm run build
